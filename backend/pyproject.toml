[project]
name = "legal-review-backend"
version = "0.1.0"
description = "Backend for the Legal Document Review & Risk Flagging Platform (FastAPI + PostgreSQL)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2; platform_system != 'Windows' or platform_python_implementation != 'PyPy'",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "email-validator>=2.1",
    "pyjwt>=2.8",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",
    "python-multipart>=0.0.9",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
# Real engine / OCR work (Module 1 & Stages 4-5)
ocr = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pytesseract>=0.3.10",
    "Pillow>=10.3",
]
engine = [
    "scikit-learn>=1.5",
]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.4",
    "pytest-cov>=5.0",
]

[tool.setuptools]
packages = ["app", "app.routers", "app.schemas", "app.services"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"
